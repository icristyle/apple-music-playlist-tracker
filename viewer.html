<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Global Library Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Google+Sans+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface: #1e1e1e;
            --primary: #fa2d48;
            --text: #ffffff;
            --text-secondary: #aaaaaa;
            --border: rgba(255,255,255,0.1);
        }
        :root[theme="light"] {
            --bg-color: #f5f5f5;
            --surface: #ffffff;
            --primary: #d60017;
            --text: #202124;
            --text-secondary: #5f6368;
            --border: rgba(0,0,0,0.1);
        }

        body {
            background: var(--bg-color);
            color: var(--text);
            font-family: 'Google Sans', sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 0.3s;
        }

        /* Header Controls */
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 { margin: 0; font-weight: 500; font-size: 28px; }
        
        .controls { display: flex; gap: 10px; align-items: center; }
        
        .btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 24px;
            cursor: pointer;
            font-family: 'Google Sans', sans-serif;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            outline: none;
        }
        .btn:hover { background: rgba(128,128,128,0.1); }
        .btn-filled { background: var(--primary); color: white; border: none; }
        .btn-filled:hover { background: #d4253f; box-shadow: 0 4px 12px rgba(250, 45, 72, 0.3); }

        /* Массовое выделение */
        .selection-bar {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            user-select: none;
        }
        .checkbox-container input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        /* Search Bar */
        .search-bar {
            width: 100%;
            max-width: 900px;
            background: var(--surface);
            border-radius: 16px;
            padding: 4px;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid var(--border);
        }
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 12px 20px;
            font-size: 16px;
            outline: none;
            font-family: 'Google Sans', sans-serif;
        }

        /* Track List */
        .track-list {
            width: 100%;
            max-width: 900px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-radius: 16px;
            margin-bottom: 8px;
            background: transparent;
            transition: all 0.2s;
            cursor: pointer;
            border: 1px solid transparent;
            user-select: none; /* Чтобы текст не выделялся при Shift+Click */
        }

        .track-item:hover {
            background: var(--surface);
            transform: translateY(-1px);
        }

        .track-item.selected {
            background: rgba(250, 45, 72, 0.12);
            border-color: var(--primary);
        }

        .track-info { display: flex; flex-direction: column; flex: 1; margin-right: 20px; }
        .song-title { font-size: 17px; font-weight: 500; margin-bottom: 4px; }
        .song-artist { font-size: 14px; color: var(--text-secondary); }
        .song-duration { 
            font-family: 'Google Sans Mono', monospace; 
            color: var(--primary); 
            font-weight: 500;
            font-size: 14px;
        }

        /* UI Helpers */
        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 80px;
            font-size: 18px;
            line-height: 1.6;
        }

        .snackbar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 12px 24px; border-radius: 50px;
            z-index: 3000; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            font-size: 14px; pointer-events: none;
            transition: opacity 0.3s;
        }

        .ripple {
            position: absolute; background: rgba(255,255,255,0.25); border-radius: 50%;
            transform: scale(0); animation: ripple 0.5s linear; pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        /* Dialog */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.7); z-index: 4000; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--surface); padding: 30px; border-radius: 28px; 
            max-width: 350px; width: 90%; border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="pageTitle">Архив <span id="trackCount" style="opacity:0.5; font-size: 0.7em"></span></h1>
        <div class="controls">
            <button id="themeToggle" class="btn" title="Сменить тему">🌗</button>
            <button id="importBtn" class="btn">📥 Импорт</button>
            <button id="exportBtn" class="btn">📤 Экспорт</button>
            <button id="deleteBtn" class="btn btn-filled" style="display: none; opacity: 0;">Удалить (0)</button>
        </div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Найти артиста или трек...">
    </div>

    <div class="selection-bar">
        <label class="checkbox-container">
            <input type="checkbox" id="selectAllCheckbox">
            <span>Выделить все видимые</span>
        </label>
    </div>

    <div id="content" style="width: 100%; max-width: 900px;">
        </div>

    <input type="file" id="fileInput" style="display: none" accept=".json">

    <div id="custom-dialog" class="modal-overlay">
        <div class="modal-content">
            <h3 id="dialog-title" style="margin-top: 0; color: var(--text);">Подтвердите</h3>
            <p id="dialog-msg" style="color: var(--text-secondary); font-size: 15px; line-height: 1.5;"></p>
            <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 25px;">
                <button id="dialog-cancel" class="btn" style="border: none;">Отмена</button>
                <button id="dialog-confirm" class="btn btn-filled">ОК</button>
            </div>
        </div>
    </div>

    <script src="viewer.js"></script>
</body>
</html>
